<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ki Wellness</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <!-- Tailwind CSS with fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-production.css') }}" onerror="console.log('Local Tailwind CSS failed to load, using CDN')">
    <script>
        // Check if we're on localhost and disable reCAPTCHA
        const isLocalhost = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname === '0.0.0.0';
        
        if (isLocalhost) {
            console.log('🔧 Localhost detected: Loading development bypass for reCAPTCHA');
            // Load development bypass for localhost
            const bypassScript = document.createElement('script');
            bypassScript.src = '{{ url_for("static", filename="js/dev_bypass.js") }}';
            bypassScript.async = true;
            document.head.appendChild(bypassScript);
        } else if ({{ 'true' if config.RECAPTCHA_ENABLED and config.RECAPTCHA_SITE_KEY else 'false' }}) {
            console.log('🌐 Production detected: Loading reCAPTCHA');
            // Load production reCAPTCHA
            const recaptchaScript = document.createElement('script');
            recaptchaScript.src = 'https://www.google.com/recaptcha/api.js';
            recaptchaScript.async = true;
            recaptchaScript.defer = true;
            document.head.appendChild(recaptchaScript);
        } else {
            console.log('🔧 Development mode: Loading development bypass for reCAPTCHA');
            // Load development bypass
            const bypassScript = document.createElement('script');
            bypassScript.src = '{{ url_for("static", filename="js/dev_bypass.js") }}';
            bypassScript.async = true;
            document.head.appendChild(bypassScript);
        }
    </script>
    <!-- Global Ki Wellness Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ki-wellness-global.css') }}">
    <script src="{{ url_for('static', filename='js/toast_notifications.js') }}"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'forest-green': '#2d5016',
                        'sage-green': '#9ca3af',
                        'mint-green': '#10b981',
                        'soft-green': '#f0f9ff',
                        'nature-gray': '#f8fafc',
                        'calm-blue': '#3b82f6',
                        'earth-brown': '#8b4513'
                    },
                    fontFamily: {
                        'quicksand': ['Quicksand', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Login-specific styles -->
    <style>
        .hero-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        /* Ensure form elements are properly styled */
        .login-form input[type="text"],
        .login-form input[type="password"],
        .login-form input[type="email"] {
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            font-size: 0.875rem;
            line-height: 1.25rem;
            transition: all 0.2s ease;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        /* Ensure button styling is consistent */
        .btn-primary {
            background-color: #10b981 !important;
            color: white !important;
            border: none !important;
            border-radius: 0.5rem !important;
            padding: 0.75rem 1rem !important;
            font-weight: 600 !important;
            font-size: 1rem !important;
            line-height: 1.5rem !important;
            transition: all 0.2s ease !important;
            cursor: pointer !important;
        }
        
        .btn-primary:hover {
            background-color: #059669 !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }
        
        /* Ensure proper spacing and layout */
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f9fafb;
        }
        
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            width: 100%;
            max-width: 28rem;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="login-container">
        <!-- Main Content Container -->
        <div class="flex-1 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
            <!-- Header -->
            <div class="sm:mx-auto sm:w-full sm:max-w-md">
                <div class="flex justify-center">
                    <img src="{{ url_for('static', filename='public/branding/logo.png') }}" alt="Ki Wellness" class="h-12 w-auto">
                </div>
                <h2 class="mt-6 text-center text-3xl font-bold text-gray-900" style="font-family: 'Quicksand', sans-serif;">
                    Welcome Back
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Sign in to your Ki  Wellness account
                </p>
            </div>

            <!-- Login Form -->
            <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                <div class="login-card">
                    <form class="space-y-6 login-form" method="POST" action="{{ url_for('auth.login') }}" onsubmit="return validateForm(event)">
                        <!-- Username Field -->
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                            <div class="mt-1">
                                <input id="username" name="username" type="text" required 
                                       class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-mint-green focus:border-transparent transition-colors duration-200"
                                       placeholder="Enter your username"
                                       autocomplete="username">
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                            <div class="mt-1 relative">
                                <input id="password" name="password" type="password" required 
                                       class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-mint-green focus:border-transparent transition-colors duration-200 pr-10"
                                       placeholder="Enter your password"
                                       autocomplete="current-password">
                                <button type="button" id="togglePassword" 
                                        class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Honeypot field (hidden from users) -->
                        <div style="display: none;">
                            <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
                        </div>
                        
                        <!-- Remember Me and Forgot Password -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input id="remember_me" name="remember_me" type="checkbox" 
                                       class="h-4 w-4 text-mint-green focus:ring-mint-green border-gray-300 rounded">
                                <label for="remember_me" class="ml-2 block text-sm text-gray-900">
                                    Remember me
                                </label>
                            </div>
                            <div class="text-sm">
                                <a href="{{ url_for('auth.forgot_password') }}" class="font-medium text-mint-green hover:text-forest-green transition-colors duration-200">
                                    Forgot password?
                                </a>
                            </div>
                        </div>

                        <!-- Google reCAPTCHA v2 Checkbox -->
                        <div id="recaptcha-container">
                            <!-- This will be populated by JavaScript based on environment -->
                        </div>
                        
                        <script>
                            // Dynamically show reCAPTCHA or development message
                            const recaptchaContainer = document.getElementById('recaptcha-container');
                            
                            if (isLocalhost) {
                                recaptchaContainer.innerHTML = `
                                    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                                        <p class="text-xs text-yellow-800 text-center">
                                            <strong>Localhost Detected:</strong> Security verification is disabled for local development.
                                        </p>
                                    </div>
                                `;
                            } else if (!isLocalhost && {{ 'true' if config.RECAPTCHA_ENABLED and config.RECAPTCHA_SITE_KEY else 'false' }}) {
                                recaptchaContainer.innerHTML = `
                                    <div class="flex justify-center">
                                        <div class="g-recaptcha" data-sitekey="{{ config.RECAPTCHA_SITE_KEY }}"></div>
                                    </div>
                                `;
                            } else {
                                recaptchaContainer.innerHTML = `
                                    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                                        <p class="text-xs text-yellow-800 text-center">
                                            <strong>Development Mode:</strong> Security verification is disabled for testing.
                                        </p>
                                    </div>
                                `;
                            }
                        </script>
                        
                        <button type="submit" 
                                class="w-full btn-primary py-3 px-4 rounded-lg font-semibold transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-mint-green focus:ring-offset-2 text-lg">
                            Sign In
                        </button>
                    </form>
                    
                    <!-- OAuth Divider -->
                    <div class="mt-6">
                        <div class="relative">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-2 bg-white text-gray-500">Or continue with</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Google OAuth Button -->
                    <div class="mt-6">
                        <a href="{{ url_for('auth.google_login') }}" 
                           class="w-full flex justify-center items-center px-4 py-3 border border-gray-300 rounded-lg shadow-sm bg-white text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-mint-green transition-all duration-200">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Continue with Google
                        </a>
                    </div>
                    
                    <div class="mt-6 text-center">
                        <p class="text-gray-600">Don't have an account? 
                            <a href="{{ url_for('auth.register') }}" class="text-mint-green hover:text-forest-green font-medium transition-colors duration-200">
                                Create one here
                            </a>
                        </p>
                    </div>
                    

                </div>
            </div>
        </div>

        <!-- Footer - Full Width -->
        {% include 'includes/footer.html' %}
    </div>

    <!-- Security Features JavaScript -->
    <script>
        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('svg');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                `;
            } else {
                passwordInput.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        });

        // Form validation and submission function
        function validateForm(e) {
            e.preventDefault(); // Prevent default form submission
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember_me').checked;
            
            // Basic validation
            if (!username || username.length < 3) {
                showError('Username must be at least 3 characters long.', 'Validation Error');
                return false;
            }
            
            if (!password || password.length < 8) {
                showError('Password must be at least 8 characters long.', 'Validation Error');
                return false;
            }
            
            // reCAPTCHA validation (only if enabled)
            {% if config.RECAPTCHA_ENABLED %}
            if (typeof grecaptcha !== 'undefined') {
                // Get the reCAPTCHA response
                const recaptchaResponse = grecaptcha.getResponse();
                
                if (!recaptchaResponse) {
                    showError('Please complete the security verification checkbox.', 'Security Error');
                    return false;
                }
            } else {
                // Check if we're in development mode
                const isLocalhost = window.location.hostname === 'localhost' || 
                                  window.location.hostname === '127.0.0.1' || 
                                  window.location.hostname === '0.0.0.0';
                
                if (!isLocalhost) {
                    showError('Security verification system is not available. Please refresh the page and try again.', 'Security Error');
                    return false;
                }
            }
            {% endif %}
            
            // Disable submit button to prevent double submission
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';
            
            // Prepare JSON data
            const formData = {
                username: username,
                password: password,
                remember_me: rememberMe
            };
            
            // Submit form via AJAX
            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                return response.text().then(text => {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('Invalid JSON response');
                    }
                });
            })
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect_url;
                } else {
                    showError(data.error, 'Login Failed');
                    
                    // Re-enable submit button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            })
            .catch(error => {
                showError('Network error. Please try again.', 'Connection Error');
                
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            });
            
            return false; // Prevent default form submission
        }



        // Rate limiting for failed attempts
        let loginAttempts = 0;
        const maxAttempts = 5;
        
        // Check for existing failed attempts
        const failedAttempts = localStorage.getItem('loginAttempts') || 0;
        if (failedAttempts >= maxAttempts) {
            const lockoutTime = localStorage.getItem('lockoutTime');
            const now = Date.now();
            
            if (lockoutTime && (now - lockoutTime) < 300000) { // 5 minutes
                const remainingTime = Math.ceil((300000 - (now - lockoutTime)) / 1000);
                showWarning(`Too many failed attempts. Please try again in ${remainingTime} seconds.`, 'Account Locked');
                document.querySelector('form').style.display = 'none';
            } else {
                // Reset lockout
                localStorage.removeItem('loginAttempts');
                localStorage.removeItem('lockoutTime');
            }
        }
    </script>
    {% include 'includes/modal.html' %}
</body>
</html>
