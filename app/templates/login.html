{% extends "layout.html" %}

{% block content %}

<section class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center space-y-4">
  <h2 class="text-3xl font-papyrus text-forest">🌿 Login</h2>
  <p class="text-gray-700 mb-4">
    Welcome back! Sign in to continue your wellness journey.
  </p>
  <form method="post" class="space-y-3">
    <input
      type="email"
      name="email"
      placeholder="Email"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />
    <input
      type="password"
      name="password"
      placeholder="Password"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />
    <button
      type="submit"
      class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition"
    >
      🌱 Login
    </button>
    <div class="flex justify-between mt-2 text-sm">
      <a href="/forgot-password" class="text-green-800 hover:underline">
        Forgot password?
      </a>
      <a href="/signup" class="text-green-800 hover:underline">
        Create account
      </a>
    </div>
  </form>
</section>

{% endblock %}
