{% extends "layout.html" %}

{% block content %}

<!-- 🧾 Forgot Password Section -->
<section class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center space-y-4">
  <h2 class="text-3xl font-papyrus text-green-600">🔑 Forgot Password</h2>
  <p class="text-gray-700 mb-4">
    Enter your email, and we'll send you a reset link.
  </p>

  <!-- 📬 Forgot Password Form -->
  <form id="forgot-form" class="space-y-3">
    <!-- 📧 Email Input -->
    <input
      type="email"
      id="email"
      placeholder="Your email address"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />

    <!-- 🔘 Submit Button -->
    <button
      type="submit"
      class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition"
    >
      📧 Send Reset Link
    </button>

    <!-- 🔁 Navigation back to login -->
    <div class="mt-2 text-sm">
      <a href="/login" class="text-green-600 hover:underline">← Back to Login</a>
    </div>
  </form>

  <!-- 💬 Status Output -->
  <p id="status" class="text-sm text-gray-600 mt-2"></p>
</section>

{% endblock %}

<!-- 🧠 JavaScript Logic to Trigger Reset Email -->
{% raw %}
<script type="module">
  // 1. Import Supabase client (ES module)
  import { createClient } from 'https://esm.sh/@supabase/supabase-js'

  // 2. Run only after page DOM is fully loaded
  document.addEventListener("DOMContentLoaded", () => {
    // 3. Create Supabase client with injected env vars (from FastAPI)
    const supabase = createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}")

    // 4. Handle form submit event
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault()

      // 5. Get entered email
      const email = document.getElementById("email").value

      // 6. Request password reset email from Supabase
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://kiwellness.org/reset-password"  // 🔁 This must match your domain exactly
      })

      // 7. Show feedback
      const statusEl = document.getElementById("status")
      if (error) {
        statusEl.textContent = `❌ ${error.message}`
      } else {
        statusEl.textContent = "✅ Reset link sent! Check your email."
      }
    })
  })
</script>
{% endraw %}
