{% extends "layout.html" %}

{% block content %}

<section class="max-w-md mx-auto p-6 bg-white shadow rounded-lg mt-12 space-y-6 text-center">
  <h1 class="text-2xl font-papyrus text-forest">Ki Wellness</h1>
  <h2 class="text-xl font-medium text-gray-800">🔑 Reset Your Password</h2>

  <p class="text-gray-700 text-sm">
    Enter your new password below to complete the reset process.
  </p>

  <form id="reset-form" class="space-y-4" style="display: none;">
    <input
      type="password"
      name="password"
      placeholder="New password"
      required
      class="w-full px-4 py-2 border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
    />

    <button
      type="submit"
      class="w-full bg-green-700 text-white py-2 rounded hover:bg-green-800 transition"
    >
      🔓 Set New Password
    </button>
  </form>

  <p id="status-msg" class="text-sm text-gray-600 text-center mt-4"></p>

  <div class="text-sm text-gray-600 mt-4">
    <a href="/login" class="text-green-700 underline hover:text-green-800">Back to Login</a>
  </div>
</section>

<!-- Supabase.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  const SUPABASE_URL = "{{ SUPABASE_URL }}";
  const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener("DOMContentLoaded", async () => {
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const access_token = hashParams.get("access_token");
    const refresh_token = hashParams.get("refresh_token");
    const statusMsg = document.getElementById("status-msg");

    if (!access_token || !refresh_token) {
      statusMsg.textContent = "❌ Missing access token. Please use the reset link from your email.";
      return;
    }

    const { error: sessionError } = await supabase.auth.setSession({
      access_token,
      refresh_token,
    });

    if (sessionError) {
      statusMsg.textContent = "❌ Session error: " + sessionError.message;
      return;
    }

    document.getElementById("reset-form").style.display = "block";

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = e.target.password.value;
      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        statusMsg.textContent = "❌ " + error.message;
      } else {
        statusMsg.textContent = "✅ Password updated! Redirecting...";
        setTimeout(() => (window.location.href = "/login"), 2000);
      }
    });
  });
</script>

{% endblock %}
