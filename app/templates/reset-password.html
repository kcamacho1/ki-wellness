{% extends "layout.html" %}

{% block content %}

<!-- 🔒 Reset Password Section -->
<section class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center space-y-4">
  <h2 class="text-3xl font-papyrus text-green-600">🔒 Reset Password</h2>
  <p class="text-gray-700 mb-4">Enter a new password to update your account.</p>

  <!-- Password Update Form -->
  <form id="reset-form" class="space-y-3">
    <input
      type="password"
      id="new-password"
      placeholder="New Password"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />
    <button
      type="submit"
      class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition"
    >
      🔄 Update Password
    </button>
    <div id="status" class="text-sm text-gray-600 mt-2"></div>
  </form>
</section>

<!-- ✅ Inject SUPABASE values into plain JS variables -->
<script>
  const SUPABASE_URL = "{{ SUPABASE_URL }}";
  const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";
</script>

<!-- ✅ Main Supabase reset logic -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  const statusEl = document.getElementById("status")

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      // 1. Recover session from reset-password email link
      const { data, error } = await supabase.auth.getSessionFromUrl({ storeSession: true })
      if (error || !data.session) {
        statusEl.textContent = "❌ Invalid or expired reset link."
        return
      }

      // 2. Confirm session is valid
      const { data: userData, error: userError } = await supabase.auth.getUser()
      if (userError || !userData.user) {
        statusEl.textContent = "⚠️ Unable to verify session. Request a new link."
        return
      }

      // 3. Clean up the URL fragment so it's not reused
      history.replaceState(null, "", window.location.pathname)

      // 4. Handle new password submission
      document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault()
        const newPassword = document.getElementById("new-password").value

        const { error: updateError } = await supabase.auth.updateUser({ password: newPassword })

        if (updateError) {
          statusEl.textContent = `❗ ${updateError.message}`
        } else {
          statusEl.textContent = "✅ Password updated! Redirecting to login..."
          document.getElementById("reset-form").reset()
          setTimeout(() => window.location.href = "/login", 2000)
        }
      })

    } catch (err) {
      console.error("Reset error:", err)
      statusEl.textContent = "⚠️ Unexpected error. Try again later."
    }
  })
</script>

{% endblock %}
