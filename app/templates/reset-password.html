{% extends "layout.html" %}

{% block content %}

<!-- ✅ Reset Password Page Section -->
<section class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center space-y-4">
  <h2 class="text-3xl font-papyrus text-green-600">🔑 Forgot Password</h2>
  <p class="text-gray-700 mb-4">Enter your email, and we'll send you a reset link.</p>

  <!-- ✅ Password Reset Form -->
  <form id="forgot-form" class="space-y-3">
    <input
      type="email"
      id="email"
      placeholder="Your email address"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />

    <button
      type="submit"
      class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition"
    >
      📧 Send Reset Link
    </button>

    <!-- 🔗 Back to login -->
    <div class="mt-2 text-sm">
      <a href="/login" class="text-green-600 hover:underline">← Back to Login</a>
    </div>
  </form>

  <!-- 💬 Status message -->
  <p id="status" class="text-sm text-gray-600 mt-2"></p>
</section>

<!-- ✅ JavaScript logic to handle reset request -->
{% raw %}
<script type="module">
  // Import Supabase client from CDN
  import { createClient } from 'https://esm.sh/@supabase/supabase-js'

  // Wait for the DOM to be fully loaded
  document.addEventListener("DOMContentLoaded", () => {
    // Create Supabase client using injected env variables
    const supabase = createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}")

    // Handle form submit event
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault()

      // Get the entered email address
      const email = document.getElementById("email").value

      // Send password reset request
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://kiwellness.org/reset-password"  // 🔁 Redirect to your reset-password page
      })

      // Show success or error message
      const statusEl = document.getElementById("status")
      if (error) {
        statusEl.textContent = `❌ ${error.message}`
      } else {
        statusEl.textContent = "✅ Reset link sent! Check your email."
      }
    })
  })
</script>
{% endraw %}

{% endblock %}
