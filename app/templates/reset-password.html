{% extends "layout.html" %}

{% block content %}

<section class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center space-y-4">
  <h2 class="text-3xl font-papyrus text-green-600">🔒 Reset Password</h2>
  <p class="text-gray-700 mb-4">Enter a new password to update your account.</p>

  <form id="reset-form" class="space-y-3">
    <input
      type="password"
      id="new-password"
      placeholder="New Password"
      class="border border-gray-300 p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-green-300"
      required
    />

    <button
      type="submit"
      class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition"
    >
      🔄 Update Password
    </button>

    <div id="status" class="text-sm text-gray-600 mt-2"></div>
  </form>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js'

  const supabase = createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}")

  // 🧠 Only run session recovery once
  let sessionSet = false
  if (window.location.hash.includes("access_token") && window.location.hash.includes("type=recovery")) {
    const { data, error } = await supabase.auth.getSessionFromUrl()
    sessionSet = !!data.session
    if (error || !data.session) {
      document.getElementById("status").textContent = "❌ Invalid or expired reset link."
    }
    // Clean up URL
    history.replaceState(null, "", window.location.pathname)
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault()
    const newPassword = document.getElementById("new-password").value

    const { error } = await supabase.auth.updateUser({ password: newPassword })
    const statusEl = document.getElementById("status")

    if (error) {
      statusEl.textContent = `❗ ${error.message}`
    } else {
      statusEl.textContent = "✅ Password updated! Redirecting to login..."
      setTimeout(() => {
        window.location.href = "/login"
      }, 2000)
    }
  })
</script>


{% endblock %}
