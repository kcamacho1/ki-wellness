{% extends "layout.html" %}

{% block content %}

<section class="max-w-md mx-auto p-6 bg-white shadow rounded-lg mt-12 space-y-6 text-center">
  <h1 class="text-2xl font-papyrus text-forest">🔑 Reset Your Password</h1>

  <p class="text-gray-700 text-sm">
    Enter your new password below to complete the reset process.
  </p>

  <form action="/reset-password" method="post" class="space-y-4">
    <input type="hidden" name="token" id="token">

    <input
      type="password"
      name="password"
      placeholder="New password"
      required
      class="w-full px-4 py-2 border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
    />

    <button
      type="submit"
      class="w-full bg-green-700 text-white py-2 rounded hover:bg-green-800 transition"
    >
      🔓 Set New Password
    </button>
  </form>

  <div class="text-sm text-gray-600 mt-4">
    <a href="/login" class="text-green-700 underline hover:text-green-800">Back to Login</a>
  </div>
</section>

<script>
  // Extract access_token from URL and assign to hidden form input
  const params = new URLSearchParams(window.location.search);
  const token = params.get("access_token");
  if (token) {
    document.getElementById("token").value = token;
  }
</script>

{% endblock %}
