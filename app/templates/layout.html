<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <title>Ki Wellness</title>
  <link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-papyrus {
      font-family: Papyrus, fantasy, sans-serif;
    }
    .text-forest {
      color: #2f5d50;
    }
    .hover-bg-moss:hover {
      background-color: #e6f0ec;
    }
  </style>
</head>

<body class="bg-[#f9f8f6] font-sans text-gray-800">
<div class="max-w-3xl mx-auto">
  <header class="bg-white rounded-b-lg shadow-md p-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <a href="/">
        <img src="/static/logoname.png" alt="Ki Wellness Logo" class="h-10" />
      </a>
    </div>

    <div x-data="{ open: false }" class="relative">
      <button @click="open = !open" class="flex items-center space-x-1 focus:outline-none transition-colors hover:text-forest">
        {% if user %}
          <span class="text-forest font-semibold">
            Hello{% if user.email %}, {{ user.email }}{% endif %}
          </span>
        {% else %}
          <span class="text-forest font-semibold">Menu</span>
        {% endif %}
        <svg class="w-6 h-6 text-forest" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      {% if user %}
      <div x-show="open" @click.away="open = false"
           class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
        <a href="/profile" class="block px-4 py-2 text-forest hover-bg-moss transition">Profile</a>
        <a href="/ai-coach" class="block px-4 py-2 text-forest hover-bg-moss transition">AI Health Coach</a>
        <a href="/human-coach" class="block px-4 py-2 text-forest hover-bg-moss transition">Human Coach</a>
        <a href="/resources" class="block px-4 py-2 text-forest hover-bg-moss transition">Resources</a>
        <a href="/settings" class="block px-4 py-2 text-forest hover-bg-moss transition">Settings</a>
        <a href="/logout" class="block px-4 py-2 text-forest hover-bg-moss transition">Logout</a>
      </div>
      {% else %}
      <div x-show="open" @click.away="open = false"
           class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
        <a href="/" class="block px-4 py-2 text-forest hover-bg-moss transition">Home</a>
        <a href="/login" class="block px-4 py-2 text-forest hover-bg-moss transition">AI Health Coach</a>
        <a href="/human-coach" class="block px-4 py-2 text-forest hover-bg-moss transition">Human Coach</a>
        <a href="/resources" class="block px-4 py-2 text-forest hover-bg-moss transition">Resources</a>
        <a href="/about" class="block px-4 py-2 text-forest hover-bg-moss transition">About</a>
        <a href="/login" class="block px-4 py-2 text-forest hover-bg-moss transition">Login</a>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="p-4">
    {% block content %}{% endblock %}
  </main>
</div>
<footer class="bg-white mt-10 border-t border-green-100 text-center text-xs text-gray-500 py-6 space-y-2">

  <div class="flex justify-center gap-6 text-gray-600 text-base pt-2">
    <p>Socials</p>
      <a href="https://www.instagram.com/ki.wellness.ai/" target="_blank" rel="noopener noreferrer" class="w-5 h-5 inline" title="Instagram">
        <img src="/static/public/inst-icon.svg" /></a>
      <a href="https://medium.com/@ki_wellness" target="_blank" rel="noopener noreferrer" class="w-5 h-5 inline" title="Medium"><img src="/static/public/medium-icon.svg" /></a>
      <a href="mailto:hello@kiwellness.org" class="w-5 h-5 inline" title="Email">
        <img src="/static/public/email-icon.png" /></a>
  </div>

  <div class="flex justify-center gap-4 text-sm">
    <a href="/privacy" class="text-green-700 underline hover:text-green-900">Privacy Policy</a>
    <span>&middot;</span>
    <a href="/terms" class="text-green-700 underline hover:text-green-900">Terms of Service</a>
  </div>

  <p class="text-gray-400 text-xs pt-1">
    &copy; {{ current_year }} Ki Wellness. All rights reserved.
  </p>
</footer>


<script>
  // Set current year in footer
  document.addEventListener("DOMContentLoaded", function() {
    const currentYear = new Date().getFullYear();
    document.querySelectorAll('.current-year').forEach(el => el.textContent = currentYear);
  });

<!-- password reset redirect -->
  <script type="module">
    const hash = window.location.hash

    if (hash.includes("access_token") && hash.includes("type=recovery")) {
      // Redirect to /reset-password so Supabase JS can handle session
      window.location.href = "/reset-password" + hash
    }
  </script>

</body>
</html>
