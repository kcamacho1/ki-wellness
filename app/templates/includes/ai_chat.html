<!-- AI Chat Box Component -->
<style>
    /* AI Chat animations and styling */
    .ai-chat-enter {
        animation: aiChatEnter 0.6s ease-out;
    }
    
    @keyframes aiChatEnter {
        0% {
            opacity: 0;
            transform: translateY(20px) scale(0.8);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    
    .ai-chat-pulse {
        animation: aiChatPulse 2s ease-in-out infinite;
    }
    
    @keyframes aiChatPulse {
        0%, 100% {
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3), 0 4px 6px -2px rgba(16, 185, 129, 0.1);
        }
        50% {
            box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.4), 0 8px 12px -4px rgba(16, 185, 129, 0.2);
        }
    }
    
    #ai-chat-toggle {
        animation: aiChatPulse 2s ease-in-out infinite;
    }
    
    #ai-chat-interface {
        animation: aiChatEnter 0.6s ease-out;
    }
</style>

<div id="ai-chat-container" class="fixed bottom-8 right-8 z-50">
    <!-- Chat Toggle Button (when minimized) -->
    <button id="ai-chat-toggle" 
            class="bg-mint-green hover:bg-sage-green text-forest-green p-5 rounded-full shadow-xl transition-all duration-300 transform hover:scale-110 hidden border-2 border-white"
            aria-label="Open AI Chat">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
        <div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
    </button>

    <!-- Chat Interface (when maximized) -->
    <div id="ai-chat-interface" class="bg-white rounded-2xl shadow-2xl border border-gray-200 w-[420px] h-[550px] flex flex-col hover:shadow-3xl transition-all duration-300">
        <!-- Chat Header -->
        <div class="bg-gradient-to-r from-mint-green to-sage-green text-forest-green p-4 rounded-t-2xl flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center mr-3">
                    <svg class="w-5 h-5 text-mint-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <div>
                    <h3 class="font-bold text-lg">AI Wellness Coach</h3>
                    <p class="text-sm opacity-80">Your personal health assistant</p>
                </div>
            </div>
            <button id="ai-chat-minimize" 
                    class="text-forest-green hover:text-white transition-colors duration-200"
                    aria-label="Minimize chat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>

        <!-- Chat Messages Area -->
        <div id="ai-chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 bg-mint-green rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <div class="bg-white p-3 rounded-2xl rounded-tl-md shadow-sm max-w-xs">
                    <p class="text-gray-800 text-sm">
                        👋 Hi! I'm your AI Wellness Coach. I can help you with nutrition advice, mood tracking insights, goal setting, and general wellness questions. How can I assist you today?
                    </p>
                </div>
            </div>
        </div>

        <!-- Chat Input Area -->
        <div class="p-4 bg-white border-t border-gray-200 rounded-b-2xl">
            <!-- Rate Limit Status -->
            <div id="ai-chat-rate-limit" class="text-xs text-orange-600 mb-2 hidden">
                ⏱️ Rate limit active - please wait before sending another message
            </div>
            
            <div class="flex space-x-2">
                <input type="text" 
                       id="ai-chat-input" 
                       placeholder="Ask me about wellness, nutrition, or your goals..."
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-mint-green focus:border-transparent transition-all duration-200 text-sm"
                       maxlength="500">
                <button id="ai-chat-send" 
                        class="bg-mint-green hover:bg-sage-green text-forest-green px-4 py-2 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                        aria-label="Send message">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <span class="text-xs text-gray-500">
                    <span id="ai-chat-char-count">0</span>/500
                </span>
                <div class="flex space-x-2">
                    <button id="ai-chat-clear" 
                            class="text-xs text-gray-500 hover:text-red-500 transition-colors duration-200"
                            title="Clear chat history">
                        Clear
                    </button>
                    <button id="ai-chat-help" 
                            class="text-xs text-gray-500 hover:text-mint-green transition-colors duration-200"
                            title="Get help">
                        Help
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- AI Chat JavaScript -->
<script>
class AIChatBox {
    constructor() {
        this.isMinimized = false;
        this.messages = [];
        this.isTyping = false;
        this.init();
    }

    init() {
        this.bindEvents();
        this.loadChatHistory();
        this.updateCharCount();
        
        // Show welcome notification after a short delay
        setTimeout(() => {
            this.showWelcomeNotification();
        }, 2000);
    }

    bindEvents() {
        // Toggle buttons
        document.getElementById('ai-chat-toggle').addEventListener('click', () => this.maximize());
        document.getElementById('ai-chat-minimize').addEventListener('click', () => this.minimize());
        
        // Input handling
        const input = document.getElementById('ai-chat-input');
        const sendBtn = document.getElementById('ai-chat-send');
        
        input.addEventListener('input', () => this.updateCharCount());
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', () => this.sendMessage());
        
        // Utility buttons
        document.getElementById('ai-chat-clear').addEventListener('click', () => this.clearChat());
        document.getElementById('ai-chat-help').addEventListener('click', () => this.showHelp());
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + / to toggle chat
            if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                e.preventDefault();
                if (this.isMinimized) {
                    this.maximize();
                } else {
                    this.minimize();
                }
            }
            
            // Escape to minimize chat
            if (e.key === 'Escape' && !this.isMinimized) {
                this.minimize();
            }
        });
        
        // Remember chat state
        this.loadChatState();
    }

    minimize() {
        this.isMinimized = true;
        document.getElementById('ai-chat-interface').classList.add('hidden');
        document.getElementById('ai-chat-toggle').classList.remove('hidden');
        this.saveChatState();
    }

    maximize() {
        this.isMinimized = false;
        document.getElementById('ai-chat-interface').classList.remove('hidden');
        document.getElementById('ai-chat-toggle').classList.add('hidden');
        this.scrollToBottom();
        this.saveChatState();
        
        // Focus on input when maximizing
        const input = document.getElementById('ai-chat-input');
        if (input) {
            input.focus();
        }
        
        // Add entrance animation
        const chatInterface = document.getElementById('ai-chat-interface');
        chatInterface.classList.add('ai-chat-enter');
    }

    updateCharCount() {
        const input = document.getElementById('ai-chat-input');
        const charCount = document.getElementById('ai-chat-char-count');
        charCount.textContent = input.value.length;
        
        // Change color based on length
        if (input.value.length > 400) {
            charCount.className = 'text-xs text-red-500';
        } else if (input.value.length > 300) {
            charCount.className = 'text-xs text-orange-500';
        } else {
            charCount.className = 'text-xs text-gray-500';
        }
    }

    async sendMessage() {
        const input = document.getElementById('ai-chat-input');
        const sendBtn = document.getElementById('ai-chat-send');
        const message = input.value.trim();
        
        if (!message || this.isTyping) return;
        
        // Disable input and button during processing
        input.disabled = true;
        sendBtn.disabled = true;
        
        // Add user message
        this.addMessage(message, 'user');
        input.value = '';
        this.updateCharCount();
        
        // Show typing indicator
        this.showTypingIndicator();
        
        try {
            // Send to AI backend
            const response = await this.sendToAI(message);
            this.hideTypingIndicator();
            this.addMessage(response, 'ai');
            
            // Re-enable input and button
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            
        } catch (error) {
            this.hideTypingIndicator();
            this.addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            console.error('AI Chat Error:', error);
            
            // Re-enable input and button
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    async sendToAI(message) {
        try {
            // Call the real AI backend endpoint
            const response = await fetch('/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            
            if (data.success) {
                return data.response;
            } else {
                console.error('AI Chat Error:', data.error);
                
                // Handle rate limiting specifically
                if (response.status === 429) {
                    this.showRateLimitWarning();
                    return "I'm receiving too many requests right now. Please wait a moment before asking another question.";
                }
                
                return `I'm sorry, I encountered an error: ${data.error}. Please try again in a moment.`;
            }
        } catch (error) {
            console.error('AI Chat Network Error:', error);
            return "I'm sorry, I'm having trouble connecting right now. Please check your internet connection and try again.";
        }
    }

    addMessage(content, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-start space-x-3';
        
        if (sender === 'user') {
            messageDiv.innerHTML = `
                <div class="w-8 h-8 bg-calm-blue rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="bg-calm-blue text-white p-3 rounded-2xl rounded-tr-md shadow-sm max-w-xs ml-auto">
                    <p class="text-sm">${this.escapeHtml(content)}</p>
                </div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="w-8 h-8 bg-mint-green rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <div class="bg-white p-3 rounded-2xl rounded-tl-md shadow-sm max-w-xs">
                    <p class="text-gray-800 text-sm">${this.escapeHtml(content)}</p>
                </div>
            `;
        }
        
        const messagesContainer = document.getElementById('ai-chat-messages');
        messagesContainer.appendChild(messageDiv);
        
        // Store message
        this.messages.push({ content, sender, timestamp: new Date() });
        this.saveChatHistory();
        
        this.scrollToBottom();
    }

    showTypingIndicator() {
        this.isTyping = true;
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typing-indicator';
        typingDiv.className = 'flex items-start space-x-3';
        typingDiv.innerHTML = `
            <div class="w-8 h-8 bg-mint-green rounded-full flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
            </div>
            <div class="bg-white p-3 rounded-2xl rounded-tl-md shadow-sm">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
            </div>
        `;
        
        const messagesContainer = document.getElementById('ai-chat-messages');
        messagesContainer.appendChild(typingDiv);
        this.scrollToBottom();
    }

    hideTypingIndicator() {
        this.isTyping = false;
        const typingIndicator = document.getElementById('typing-indicator');
        if (typingIndicator) {
            typingIndicator.remove();
        }
    }

    clearChat() {
        if (confirm('Are you sure you want to clear the chat history?')) {
            const messagesContainer = document.getElementById('ai-chat-messages');
            // Keep only the welcome message
            const welcomeMessage = messagesContainer.firstElementChild;
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(welcomeMessage);
            
            this.messages = [];
            this.saveChatHistory();
        }
    }

    showHelp() {
        const helpMessage = `Here are some things you can ask me about:
        
• Nutrition advice and meal planning
• Mood tracking and mental wellness
• Exercise and fitness recommendations
• Goal setting and progress tracking
• General wellness questions
• Sleep and stress management

💡 **Keyboard Shortcuts:**
• Ctrl/Cmd + / : Toggle chat
• Escape : Minimize chat

Feel free to ask anything related to your health and wellness journey!`;
        
        this.addMessage(helpMessage, 'ai');
    }

    scrollToBottom() {
        const messagesContainer = document.getElementById('ai-chat-messages');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    saveChatHistory() {
        try {
            localStorage.setItem('ai-chat-history', JSON.stringify(this.messages));
        } catch (error) {
            console.error('Failed to save chat history:', error);
        }
    }

    loadChatHistory() {
        try {
            const saved = localStorage.getItem('ai-chat-history');
            if (saved) {
                this.messages = JSON.parse(saved);
                // Re-render messages (excluding welcome message)
                this.messages.forEach(msg => {
                    if (msg.sender !== 'welcome') {
                        this.addMessage(msg.content, msg.sender);
                    }
                });
            }
        } catch (error) {
            console.error('Failed to load chat history:', error);
        }
    }

    saveChatState() {
        try {
            localStorage.setItem('ai-chat-state', JSON.stringify({
                isMinimized: this.isMinimized,
                lastActive: new Date().toISOString()
            }));
        } catch (error) {
            console.error('Failed to save chat state:', error);
        }
    }

    loadChatState() {
        try {
            const saved = localStorage.getItem('ai-chat-state');
            if (saved) {
                const state = JSON.parse(saved);
                // Restore minimized state if it was minimized
                if (state.isMinimized) {
                    this.minimize();
                }
            }
        } catch (error) {
            console.error('Failed to load chat state:', error);
        }
    }

    showRateLimitWarning() {
        const rateLimitDiv = document.getElementById('ai-chat-rate-limit');
        if (rateLimitDiv) {
            rateLimitDiv.classList.remove('hidden');
            
            // Hide after 30 seconds
            setTimeout(() => {
                rateLimitDiv.classList.add('hidden');
            }, 30000);
        }
    }

    showWelcomeNotification() {
        // Only show if chat is minimized and user hasn't seen it recently
        if (this.isMinimized && !localStorage.getItem('ai-chat-welcome-shown')) {
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-24 right-8 bg-white border border-mint-green rounded-lg shadow-lg p-3 max-w-xs z-50 animate-bounce';
            notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 bg-mint-green rounded-full animate-pulse"></div>
                    <span class="text-sm text-gray-700">💬 Need wellness advice? Click the chat button!</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove notification after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 5000);
            
            // Mark as shown
            localStorage.setItem('ai-chat-welcome-shown', 'true');
        }
    }
}

// Initialize AI Chat Box when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    // Check if user is logged in by looking for session data or user-specific elements
    const isLoggedIn = {{ 'true' if session.get('user_id') else 'false' }};
    
    if (isLoggedIn) {
        window.aiChatBox = new AIChatBox();
    } else {
        // Hide the chat container if user is not logged in
        const chatContainer = document.getElementById('ai-chat-container');
        if (chatContainer) {
            chatContainer.style.display = 'none';
        }
    }
});
</script>
