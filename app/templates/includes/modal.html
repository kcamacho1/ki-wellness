<!-- Reusable Modal Component -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 transform transition-all">
        <!-- Modal Header -->
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
            <h3 id="modal-title" class="text-lg font-semibold text-gray-900">
                <!-- Title will be set dynamically -->
            </h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Modal Body -->
        <div class="p-6">
            <div id="modal-icon" class="flex justify-center mb-4">
                <!-- Icon will be set dynamically -->
            </div>
            <p id="modal-message" class="text-gray-700 text-center">
                <!-- Message will be set dynamically -->
            </p>
        </div>
        
        <!-- Modal Footer -->
        <div class="flex justify-end p-6 border-t border-gray-200">
            <button id="modal-button" onclick="closeModal()" class="px-4 py-2 bg-mint-green text-forest-green rounded-lg font-medium hover:bg-sage-green transition-colors">
                OK
            </button>
        </div>
    </div>
</div>

<!-- Modal JavaScript -->
<script>
// Global modal functions
function showModal(title, message, type = 'info', buttonText = 'OK', onClose = null) {
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalIcon = document.getElementById('modal-icon');
    const modalButton = document.getElementById('modal-button');
    
    // Set title and message
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalButton.textContent = buttonText;
    
    // Set icon based on type
    let iconHTML = '';
    let titleColor = 'text-gray-900';
    
    switch(type) {
        case 'success':
            iconHTML = '<svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            titleColor = 'text-green-600';
            break;
        case 'error':
            iconHTML = '<svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            titleColor = 'text-red-600';
            break;
        case 'warning':
            iconHTML = '<svg class="w-12 h-12 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-7.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>';
            titleColor = 'text-yellow-600';
            break;
        default: // info
            iconHTML = '<svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            titleColor = 'text-blue-600';
            break;
    }
    
    modalIcon.innerHTML = iconHTML;
    modalTitle.className = `text-lg font-semibold ${titleColor}`;
    
    // Store callback
    modal.onCloseCallback = onClose;
    
    // Show modal
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    // Focus on button for accessibility
    setTimeout(() => {
        modalButton.focus();
    }, 100);
}

function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    
    // Call callback if exists
    if (modal.onCloseCallback) {
        modal.onCloseCallback();
        modal.onCloseCallback = null;
    }
}

// Close modal when clicking outside
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('modal');
    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            closeModal();
        }
    });
    
    // Close modal with Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
            closeModal();
        }
    });
});

// Convenience functions for common alert types
function showSuccess(message, title = 'Success') {
    showModal(title, message, 'success');
}

function showError(message, title = 'Error') {
    showModal(title, message, 'error');
}

function showWarning(message, title = 'Warning') {
    showModal(title, message, 'warning');
}

function showInfo(message, title = 'Information') {
    showModal(title, message, 'info');
}

// Replace alert function globally
window.alert = function(message) {
    showInfo(message, 'Notice');
};
</script>
