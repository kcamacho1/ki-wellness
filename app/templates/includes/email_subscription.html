<!-- Email Subscription Component -->
<div class="email-subscription-component">
    <div class="p-4 rounded-lg border bg-blue-50 border-blue-200 text-blue-800">
        <div class="flex items-center mb-3">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm font-medium">{{ message|default('Account creation closed, provide your email to be notified when sign up is open') }}</p>
            </div>
        </div>
        
        <!-- Email Subscription Form -->
        <form class="email-subscription-form mt-4" data-component-id="{{ component_id|default('email-subscription') }}">
            <div class="flex space-x-2">
                <input type="email" 
                       class="subscription-email-input flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                       placeholder="Enter your email address"
                       required>
                <button type="submit" 
                        class="subscription-submit-btn px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm font-medium transition-colors duration-200">
                    Subscribe
                </button>
            </div>
            <div class="subscription-message mt-2 text-xs"></div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize all email subscription forms
    const subscriptionForms = document.querySelectorAll('.email-subscription-form');
    
    subscriptionForms.forEach(function(form) {
        const emailInput = form.querySelector('.subscription-email-input');
        const submitBtn = form.querySelector('.subscription-submit-btn');
        const messageDiv = form.querySelector('.subscription-message');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            // Basic email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showSubscriptionMessage(messageDiv, 'Please enter a valid email address.', 'error');
                return;
            }
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Subscribing...';
            
            // Send subscription request
            fetch('{{ url_for("auth.subscribe_email") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showSubscriptionMessage(messageDiv, data.message, 'success');
                    emailInput.value = '';
                } else {
                    showSubscriptionMessage(messageDiv, data.error, 'error');
                }
            })
            .catch(error => {
                console.error('Subscription error:', error);
                showSubscriptionMessage(messageDiv, 'An error occurred. Please try again.', 'error');
            })
            .finally(() => {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Subscribe';
            });
        });
    });
    
    function showSubscriptionMessage(messageDiv, message, type) {
        messageDiv.textContent = message;
        messageDiv.className = `subscription-message mt-2 text-xs ${type === 'success' ? 'text-green-600' : 'text-red-600'}`;
        
        // Clear message after 5 seconds
        setTimeout(() => {
            messageDiv.textContent = '';
            messageDiv.className = 'subscription-message mt-2 text-xs';
        }, 5000);
    }
});
</script>
